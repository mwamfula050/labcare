
# ==========================================
# LABCARE APPLICATION CONFIGURATION
# ==========================================

spring.application.name=labcare

# Server configuration
server.port=${PORT:8080}

# ==========================================
# AIVEN CLOUD MYSQL DATABASE
# ==========================================

spring.datasource.url=${DB_URL:jdbc:mysql://labcare-mysql-salimuamiri551-b89a.l.aivencloud.com:12241/defaultdb?sslMode=REQUIRED&serverTimezone=Africa/Dar_es_Salaam}
spring.datasource.username=${DB_USERNAME:avnadmin}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / HIBERNATE CONFIGURATION
# ==========================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.jpa.properties.hibernate.jdbc.time_zone=Africa/Dar_es_Salaam

# ==========================================
# SERVER ERROR CONFIGURATION
# ==========================================

server.error.include-message=always

# LabCare demo user accounts
app.users.manager.password=${LAB_MANAGER_PASSWORD:Manager@12345}
app.users.reception.password=${LAB_RECEPTION_PASSWORD:Reception@12345}
app.users.technician.password=${LAB_TECHNICIAN_PASSWORD:Technician@12345}
app.users.cashier.password=${LAB_CASHIER_PASSWORD:Cashier@12345}